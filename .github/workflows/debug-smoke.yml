name: Debug Smoke Bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    name: Build Debug Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Generate debug bundle
        shell: bash
        run: |
          mkdir -p debug-bundle
          python -V > debug-bundle/python-version.txt
          python -m pip freeze > debug-bundle/pip-freeze.txt
          python -m pytest -q --junitxml=debug-bundle/pytest-junit.xml > debug-bundle/pytest-output.txt
          python -c "from mordecai.main import create_app; app = create_app(); print(app.title)" > debug-bundle/app-smoke.txt
          ./gradlew --version > debug-bundle/gradle-version.txt
          ./gradlew :android-shell:assembleDebug > debug-bundle/android-shell-build.txt
          printf '%s\n' 'Repository tree:' > debug-bundle/tree.txt
          find . -maxdepth 3 -type f | sort >> debug-bundle/tree.txt

      - name: Upload debug bundle
        uses: actions/upload-artifact@v4
        with:
          name: mordecai-debug-bundle
          path: debug-bundle/
          if-no-files-found: error

      - name: Upload Android shell APK
        uses: actions/upload-artifact@v4
        with:
          name: mordecai-android-shell-debug-apk
          path: android-shell/build/outputs/apk/debug/*.apk
          if-no-files-found: warn