name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docs-sync:
    name: Documentation Sync Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify changelog and docs updates
        run: python scripts/check_docs_sync.py

  android-shell:
    name: Android Shell Build
    runs-on: ubuntu-latest
    needs: docs-sync

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Assemble Android shell debug APK
        run: ./gradlew :android-shell:assembleDebug

      - name: Stage Android shell release asset
        shell: bash
        run: |
          mkdir -p artifacts
          apk_path="$(find android-shell/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$apk_path"
          cp "$apk_path" artifacts/android-shell-debug.apk

      - name: Upload Android shell artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-shell-debug-apk
          path: |
            artifacts/android-shell-debug.apk
            android-shell/build/reports/**
          if-no-files-found: warn

  android-shell-release:
    name: Publish Android Shell Release Asset
    runs-on: ubuntu-latest
    needs: android-shell
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Android shell artifact
        uses: actions/download-artifact@v5
        with:
          name: android-shell-debug-apk
          path: artifacts/release

      - name: Resolve Android shell release asset path
        id: resolve_android_shell_asset
        shell: bash
        run: |
          apk_path="$(find artifacts/release -type f -name 'android-shell-debug.apk' | head -n 1)"
          test -n "$apk_path"
          printf 'apk_path=%s\n' "$apk_path" >> "$GITHUB_OUTPUT"

      - name: Publish rolling Android shell release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete android-shell-latest --yes --cleanup-tag || true
          gh release create android-shell-latest "${{ steps.resolve_android_shell_asset.outputs.apk_path }}" \
            --title "Android Shell Latest" \
            --notes "Rolling Android shell debug APK for automated phone installs.\n\nCommit: ${{ github.sha }}" \
            --target "${{ github.sha }}"

  test:
    name: Lint, Test, and Smoke
    runs-on: ${{ matrix.os }}
    needs: docs-sync
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip install build

      - name: Lint with compileall
        run: python -m compileall src mordecai_core providers self_mod net_proxy voice tests

      - name: Build source and wheel distributions
        run: python -m build --sdist --wheel

      - name: Run tests with diagnostics output
        shell: bash
        run: |
          mkdir -p artifacts
          python -m pytest -q --junitxml=artifacts/pytest-junit.xml | tee artifacts/pytest-output.txt

      - name: Smoke import and app creation
        run: |
          python -c "from mordecai.main import create_app; app = create_app(); print(app.title)"

      - name: Capture environment snapshot
        if: always()
        shell: bash
        run: |
          python -V > artifacts/python-version.txt
          python -m pip freeze > artifacts/pip-freeze.txt

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-debug-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn