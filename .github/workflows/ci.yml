name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-sync:
    name: Documentation Sync Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify changelog and docs updates
        run: python scripts/check_docs_sync.py

  test:
    name: Lint, Test, and Smoke
    runs-on: ${{ matrix.os }}
    needs: docs-sync
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Lint with compileall
        run: python -m compileall src tests

      - name: Run tests with diagnostics output
        shell: bash
        run: |
          mkdir -p artifacts
          python -m pytest -q --junitxml=artifacts/pytest-junit.xml | tee artifacts/pytest-output.txt

      - name: Smoke import and app creation
        run: |
          python -c "from mordecai.main import create_app; app = create_app(); print(app.title)"

      - name: Capture environment snapshot
        if: always()
        shell: bash
        run: |
          python -V > artifacts/python-version.txt
          python -m pip freeze > artifacts/pip-freeze.txt

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn