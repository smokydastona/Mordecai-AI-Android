name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docs-sync:
    name: Documentation Sync Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify changelog and docs updates
        run: python scripts/check_docs_sync.py

  android-shell:
    name: Android Shell Build
    runs-on: ubuntu-latest
    needs: docs-sync

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Assemble Android shell debug APK
        run: ./gradlew :android-shell:assembleDebug

      - name: Upload Android shell artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-shell-debug-apk
          path: |
            android-shell/build/outputs/apk/debug/*.apk
            android-shell/build/reports/**
          if-no-files-found: warn

  test:
    name: Lint, Test, and Smoke
    runs-on: ${{ matrix.os }}
    needs: docs-sync
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip install build

      - name: Lint with compileall
        run: python -m compileall src mordecai_core providers self_mod net_proxy voice tests

      - name: Build source and wheel distributions
        run: python -m build --sdist --wheel

      - name: Run tests with diagnostics output
        shell: bash
        run: |
          mkdir -p artifacts
          python -m pytest -q --junitxml=artifacts/pytest-junit.xml | tee artifacts/pytest-output.txt

      - name: Smoke import and app creation
        run: |
          python -c "from mordecai.main import create_app; app = create_app(); print(app.title)"

      - name: Capture environment snapshot
        if: always()
        shell: bash
        run: |
          python -V > artifacts/python-version.txt
          python -m pip freeze > artifacts/pip-freeze.txt

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-debug-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn