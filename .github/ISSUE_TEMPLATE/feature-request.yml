name: Feature request
description: Propose a new Mordecai capability.
title: "[feature] "
labels:
  - enhancement
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      placeholder: Add structured debug endpoint for failed candidate applications
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Problem to solve
      description: What user or engineering problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior, constraints, and debugging expectations.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: What tests, smoke checks, or diagnostics should prove the feature works?
    validations:
      required: true