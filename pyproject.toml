[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mordecai-ai"
version = "0.1.0"
description = "Mordecai: a sandboxed, policy-driven AI runtime for a repurposed Android device"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "psutil>=6.1,<7.0; sys_platform != 'android' and platform_system != 'Android'",
    "pyyaml>=6.0,<7.0",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn>=0.32,<1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0"
]

[tool.setuptools]
packages = [
    "mordecai",
    "mordecai_core",
    "mordecai_core.tools",
    "mordecai_core.models",
    "mordecai_core.safety",
    "providers",
    "self_mod",
    "net_proxy",
    "voice",
]

[tool.setuptools.package-dir]
mordecai = "src/mordecai"
mordecai_core = "mordecai_core"
"mordecai_core.tools" = "mordecai_core/tools"
"mordecai_core.models" = "mordecai_core/models"
"mordecai_core.safety" = "mordecai_core/safety"
providers = "providers"
self_mod = "self_mod"
net_proxy = "net_proxy"
voice = "voice"

[tool.setuptools.package-data]
net_proxy = ["config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
